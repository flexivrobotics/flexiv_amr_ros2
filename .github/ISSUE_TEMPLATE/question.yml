name: Question
description: Ask a question about using or developing Flexiv AMR ROS 2
title: "[Question]: "
labels: ["help wanted"]

body:
  - type: markdown
    attributes:
      value: |
        Please check the README, launch files, configuration files, existing issues, and release notes before opening a new question.

  - type: dropdown
    id: category
    attributes:
      label: Question category
      description: Select all areas related to your question.
      multiple: true
      options:
        - Build, install, or colcon
        - ROS 2 distribution compatibility
        - Launch files or bringup
        - Robot description, URDF, TF, or RViz
        - Sensor topics or point cloud conversion
        - IMU conversion
        - Wheel odometry
        - EKF, localization, or robot_localization
        - Driver, motion control, or emergency stop
        - Navigation or relocation services
        - Message or service definitions
        - Examples, tests, or documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ROS 2 package version
      description: Provide the release version, branch name, tag, or commit hash you are using.
      placeholder: "Example: v0.1.2 / humble@abcdef1"
    validations:
      required: true

  - type: dropdown
    id: ros-distro
    attributes:
      label: ROS 2 distribution
      description: Select the ROS 2 distribution related to your question.
      multiple: true
      options:
        - Foxy
        - Humble
        - Jazzy
        - Rolling
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, install method, AMR SDK version, and robot/controller context if relevant.
      placeholder: |
        - OS and architecture:
        - ROS 2 distribution:
        - Install method: source build / binary package / Docker
        - flexiv_amr_sdk version:
        - AMR backend, if relevant: SEER / Flexiv
        - Controller software version, if known:
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include commands, launch files, configuration snippets, logs, or documentation sections you already checked.
      placeholder: |
        ```bash
        # Commands
        ```

        ```yaml
        # Relevant parameters
        ```

  - type: input
    id: region
    attributes:
      label: Country or region
      description: This helps us understand the support context.
      placeholder: "Example: China / Germany / United States"

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe your question with enough context for others to answer.
      placeholder: "Text, screenshots, links, code blocks ..."
    validations:
      required: true
