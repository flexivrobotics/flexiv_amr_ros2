name: Feature Request
description: Suggest an improvement, new ROS 2 feature, or documentation update for Flexiv AMR ROS 2
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area does this request mainly affect?
      multiple: true
      options:
        - Build, install, or packaging
        - ROS 2 distribution compatibility
        - Launch files or bringup
        - Robot description, URDF, TF, or RViz
        - Sensor topics or point cloud conversion
        - IMU conversion
        - Wheel odometry
        - EKF, localization, or robot_localization
        - Driver, motion control, or emergency stop
        - Navigation or relocation services
        - Message or service definitions
        - Examples or tests
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      description: Select the option that best describes this request.
      multiple: true
      options:
        - New feature
        - Existing feature improvement
        - Usability improvement
        - Performance improvement
        - Compatibility improvement
        - Documentation improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Use case or problem
      description: Describe the AMR workflow, ROS 2 integration, limitation, or workaround that motivates this request.
      placeholder: "Example: We need to run the same bringup launch on both Humble and Jazzy, but one dependency behaves differently."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, node, topic, service, launch option, parameter, example, or documentation change you want.
      placeholder: |
        ```bash
        # Optional command or launch sketch
        ```

        ```yaml
        # Optional parameter sketch
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other solutions, workarounds, APIs, topics, services, or parameter shapes you considered.
      placeholder: "Example: This can also be exposed as a separate node, but a launch parameter would be simpler for existing users."

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and constraints
      description: Describe ROS 2 distribution, platform, AMR backend, controller version, or backward compatibility requirements.
      placeholder: |
        - ROS 2 distributions: Humble / Jazzy / Foxy
        - Platform:
        - AMR backend: SEER / Flexiv / all
        - Requires controller software changes:
        - Backward compatibility concerns:

  - type: dropdown
    id: safety-impact
    attributes:
      label: Safety impact
      description: Would this change affect robot motion, navigation, emergency stop, or other safety-critical behavior?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples or references
      description: Add screenshots, related issues, logs, links, rosbag details, TF trees, or reference material.
      placeholder: "Links, screenshots, logs, or reference material"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information that would help evaluate this request.
      placeholder: "Additional context"
